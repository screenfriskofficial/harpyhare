name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: фронтенд и линтеры
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks комментирует находки прямо в PR
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks сканирует историю целиком: поверхностный клон ему не годится.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t typecheck lint test
      - run: npx knip
      # Рядом с рабочей копией лежат .env с ключами: они в .gitignore, но от будущего
      # коммита это не защищает — gitleaks смотрит на то, что реально попало в историю.
      # Лицензия нужна только организациям, репозиторий личный.
      - name: Секреты в коммитах
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: тесты Rust и контракт
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      # rustfmt does not compile anything, so it runs first: a formatting drift
      # shows up in seconds instead of after the test build.
      - name: Форматирование Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Тесты Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Контракт не разъехался с закоммиченным
        run: git diff --exit-code src/ipc/bindings.ts
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Clippy в релизном профиле
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --release -- -D warnings

  windows:
    name: сборка под Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      BUILD_INSTALLER: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Вывести пути сборки из-под Defender
        continue-on-error: true
        working-directory: .
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "link.exe"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      - name: Установить зависимости
        run: npm ci
        working-directory: .
      - name: Clippy, он же компиляция тестов
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Собрать установщик
        if: env.BUILD_INSTALLER == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build
          fi
      - uses: actions/upload-artifact@v4
        if: env.BUILD_INSTALLER == 'true'
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
