<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>System Design</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
        font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;
      }
      .wrap {
        overflow: auto;
        height: 100vh;
        box-sizing: border-box;
        padding: 12px;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap"></div>
    <script>
      const { TITLE, NODES, EDGES, GROUPS } = __SYSTEM_DESIGN_DATA__;

      /* Shared renderer; model output supplies data only. */
      (function () {
        const C = {
          TF: 16,
          SF: 12,
          LF: 11,
          CW: 0.64,
          PX: 18,
          PY: 12,
          MINW: 180,
          MINH: 72,
          VGAP: 32,
          CORR: 64,
          LANE: 14,
          RY: 14,
          QR: 13,
          M: 28,
          BUS: 20,
          TLH: 22,
          SLH: 17,
        };
        const mw = (s, f) => s.length * f * C.CW;
        const byId = Object.create(null);
        NODES.forEach((n) => (byId[n.id] = n));

        /* --- размеры узлов --- */
        NODES.forEach((n) => {
          const lines = [{ t: n.title, f: C.TF }].concat(
            (n.sub || []).map((t) => ({ t, f: C.SF })),
          );
          if (n.badge) lines.push({ t: n.badge, f: C.SF });
          n.w = Math.max(
            C.MINW,
            Math.max.apply(
              null,
              lines.map((l) => mw(l.t, l.f)),
            ) +
              2 * C.PX +
              (n.kind === "queue" ? 2 * C.QR : 0),
          );
          n.inner = C.TLH + (lines.length - 1) * C.SLH;
          n.h = Math.max(C.MINH, n.inner + 2 * C.PY);
          if (n.kind === "db") n.h = n.inner + 2 * C.PY + 3 * C.RY;
          if (n.kind === "queue") n.w += 2 * C.RY;
          n.lines = lines;
        });

        /* --- классификация рёбер --- */
        EDGES.forEach((e) => {
          const a = byId[e.from],
            b = byId[e.to];
          if (!a || !b) {
            throw new Error("edge ref: " + e.from + "->" + e.to);
          }
          e.a = a;
          e.b = b;
          const dc = b.col - a.col;
          e.type = dc === 1 ? "adj" : dc > 1 ? "skip" : dc === 0 ? "same" : "back";
        });

        /* --- ширины колонок и коридоров --- */
        const nCols =
          Math.max.apply(
            null,
            NODES.map((n) => n.col),
          ) + 1;
        const colW = [],
          corrLanes = [],
          corrLab = [];
        for (let c = 0; c < nCols; c++) {
          colW[c] = 0;
          corrLanes[c] = 0;
          corrLab[c] = 0;
        }
        NODES.forEach((n) => {
          colW[n.col] = Math.max(colW[n.col], n.w);
        });
        const lane = (c, e) => {
          const i = corrLanes[c]++;
          (e.lanes = e.lanes || []).push({ c, i });
          return i;
        };
        EDGES.forEach((e) => {
          const lw = e.label ? mw(e.label, C.LF) : 0;
          if (e.type === "adj" || e.type === "same") {
            lane(e.a.col, e);
            corrLab[e.a.col] = Math.max(corrLab[e.a.col], lw);
          }
          if (e.type === "skip") {
            lane(e.a.col, e);
            lane(e.b.col - 1, e);
            corrLab[e.a.col] = Math.max(corrLab[e.a.col], lw);
          }
          if (e.type === "back") {
            if (e.a.col === 0) throw new Error("back-edge из колонки 0 запрещён: " + e.from);
            lane(e.a.col - 1, e);
            lane(e.b.col, e);
            corrLab[e.a.col - 1] = Math.max(corrLab[e.a.col - 1], lw);
          }
        });
        const corrW = [];
        for (let c = 0; c < nCols - 1; c++)
          corrW[c] = Math.max(C.CORR, 40 + corrLanes[c] * C.LANE, corrLab[c] + 56);
        corrW[nCols - 1] = corrLanes[nCols - 1] ? 40 + corrLanes[nCols - 1] * C.LANE : 0;

        /* --- x колонок --- */
        const colX = [];
        let cx = C.M;
        for (let c = 0; c < nCols; c++) {
          colX[c] = cx;
          cx += colW[c] + corrW[c];
        }
        const totalW = Math.max(cx + C.M, 400 + 2 * C.M);

        /* --- буса сверху/снизу --- */
        const topBuses = EDGES.filter((e) => e.type === "back");
        const botBuses = EDGES.filter((e) => e.type === "skip");
        const topBand = topBuses.length * C.BUS;
        const titleY = C.M - 6;

        /* --- y узлов (стек по колонкам, колонки центрируются) --- */
        const cols = [];
        for (let c = 0; c < nCols; c++) cols[c] = [];
        NODES.forEach((n) => cols[n.col].push(n));
        const colH = cols.map(
          (list) => list.reduce((s, n) => s + n.h, 0) + Math.max(0, list.length - 1) * C.VGAP,
        );
        const contentH = Math.max.apply(null, colH);
        const topY = titleY + 22 + topBand + 18;
        cols.forEach((list, c) => {
          let y = topY + (contentH - colH[c]) / 2;
          list.forEach((n) => {
            n.x = colX[c] + (colW[c] - n.w) / 2;
            n.y = y;
            y += n.h + C.VGAP;
          });
        });
        topBuses.forEach((e, k) => {
          e.busY = titleY + 18 + k * C.BUS;
        });
        botBuses.forEach((e, k) => {
          e.busY = topY + contentH + 32 + k * C.BUS;
        });
        const totalH = topY + contentH + 36 + botBuses.length * C.BUS + C.M;

        /* --- точки подключения: распределяем по граням --- */
        const ports = Object.create(null);
        NODES.forEach((n) => (ports[n.id] = { L: [], R: [] }));
        EDGES.forEach((e) => {
          if (e.type === "back") {
            ports[e.a.id].L.push(e);
            ports[e.b.id].R.push(e);
          } else if (e.type === "same") {
            ports[e.a.id].R.push(e);
            ports[e.b.id].R.push(e);
          } else {
            ports[e.a.id].R.push(e);
            ports[e.b.id].L.push(e);
          }
        });
        NODES.forEach((n) => {
          ["L", "R"].forEach((side) => {
            const list = ports[n.id][side];
            list.sort((p, q) => {
              const oy = (e) => {
                const o = e.a === n ? e.b : e.a;
                return o.y;
              };
              return oy(p) - oy(q);
            });
            list.forEach((e, i) => {
              const y = n.y + (n.h * (i + 1)) / (list.length + 1);
              if (e.a === n) e.ay = y;
              else e.by = y;
            });
          });
        });

        /* --- lane x --- */
        const laneX = (l) => colX[l.c] + colW[l.c] + 24 + l.i * C.LANE;

        /* --- пути рёбер --- */
        EDGES.forEach((e) => {
          const A = e.a,
            B = e.b,
            p = [];
          if (e.type === "adj") {
            const l = laneX(e.lanes[0]);
            p.push([A.x + A.w, e.ay], [l, e.ay], [l, e.by], [B.x, e.by]);
          } else if (e.type === "skip") {
            const l1 = laneX(e.lanes[0]),
              l2 = laneX(e.lanes[1]);
            p.push(
              [A.x + A.w, e.ay],
              [l1, e.ay],
              [l1, e.busY],
              [l2, e.busY],
              [l2, e.by],
              [B.x, e.by],
            );
          } else if (e.type === "same") {
            const l = laneX(e.lanes[0]);
            p.push([A.x + A.w, e.ay], [l, e.ay], [l, e.by], [B.x + B.w, e.by]);
          } else {
            /* back */
            const l1 = laneX(e.lanes[0]),
              l2 = laneX(e.lanes[1]);
            p.push(
              [A.x, e.ay],
              [l1, e.ay],
              [l1, e.busY],
              [l2, e.busY],
              [l2, e.by],
              [B.x + B.w, e.by],
            );
          }
          e.pts = p;
        });

        /* --- SVG --- */
        const esc = (s) =>
          String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        let S = "";
        S +=
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' +
          Math.ceil(totalW) +
          " " +
          Math.ceil(totalH) +
          '" width="' +
          Math.ceil(totalW) +
          '" height="' +
          Math.ceil(totalH) +
          '" font-family="ui-monospace,Menlo,Consolas,\'DejaVu Sans Mono\',monospace">';
        S +=
          '<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000"/></marker></defs>';
        S +=
          '<rect x="0" y="0" width="' +
          Math.ceil(totalW) +
          '" height="' +
          Math.ceil(totalH) +
          '" fill="#fff"/>';
        S +=
          '<text x="' +
          C.M +
          '" y="' +
          titleY +
          '" font-size="18" font-weight="bold" fill="#000">' +
          esc(TITLE) +
          "</text>";

        /* группы */
        GROUPS.forEach((g) => {
          const ns = g.nodes.map((id) => byId[id]).filter(Boolean);
          if (!ns.length) return;
          const x0 =
              Math.min.apply(
                null,
                ns.map((n) => n.x),
              ) - 14,
            y0 =
              Math.min.apply(
                null,
                ns.map((n) => n.y),
              ) - 14;
          const x1 =
              Math.max.apply(
                null,
                ns.map((n) => n.x + n.w),
              ) + 14,
            y1 =
              Math.max.apply(
                null,
                ns.map((n) => n.y + n.h),
              ) + 14;
          S +=
            '<rect x="' +
            x0 +
            '" y="' +
            y0 +
            '" width="' +
            (x1 - x0) +
            '" height="' +
            (y1 - y0) +
            '" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="1.5 3.5"/>';
          S +=
            '<text x="' +
            x0 +
            '" y="' +
            (y0 - 6) +
            '" font-size="11" fill="#000">' +
            esc(g.label) +
            "</text>";
        });

        /* рёбра: сначала все линии, подписи — отдельным слоем поверх */
        let LBL = "";
        EDGES.forEach((e) => {
          const d = e.pts
            .map((pt, i) => (i ? "L" : "M") + pt[0].toFixed(1) + "," + pt[1].toFixed(1))
            .join(" ");
          S +=
            '<path d="' +
            d +
            '" fill="none" stroke="#000" stroke-width="1.5"' +
            (e.async ? ' stroke-dasharray="7 5"' : "") +
            ' marker-end="url(#ah)"/>';
          if (e.label) {
            const lw = mw(e.label, C.LF) + 8;
            let lx, ly;
            if (e.type === "back") {
              lx = e.pts[0][0] - 6 - lw;
              ly = e.ay - 17;
            } else {
              lx = e.pts[0][0] + 6;
              ly = e.ay - 17;
            }
            LBL +=
              '<rect x="' + lx + '" y="' + ly + '" width="' + lw + '" height="15" fill="#fff"/>';
            LBL +=
              '<text x="' +
              (lx + 4) +
              '" y="' +
              (ly + 11.5) +
              '" font-size="' +
              C.LF +
              '" fill="#000">' +
              esc(e.label) +
              "</text>";
          }
        });
        S += LBL;

        /* узлы */
        NODES.forEach((n) => {
          const x = n.x,
            y = n.y,
            w = n.w,
            h = n.h,
            rx = w / 2,
            ry = C.RY;
          if (n.kind === "db") {
            S +=
              '<path d="M' +
              x +
              "," +
              (y + ry) +
              " L" +
              x +
              "," +
              (y + h - ry) +
              " A" +
              rx +
              "," +
              ry +
              " 0 0 0 " +
              (x + w) +
              "," +
              (y + h - ry) +
              " L" +
              (x + w) +
              "," +
              (y + ry) +
              '" fill="#fff" stroke="#000" stroke-width="1.5"/>';
            S +=
              '<ellipse cx="' +
              (x + rx) +
              '" cy="' +
              (y + ry) +
              '" rx="' +
              rx +
              '" ry="' +
              ry +
              '" fill="#fff" stroke="#000" stroke-width="1.5"/>';
          } else if (n.kind === "queue") {
            const cap = Math.min(C.RY, h / 2),
              hy = h / 2;
            S +=
              '<path d="M' +
              (x + cap) +
              "," +
              y +
              " L" +
              (x + w - cap) +
              "," +
              y +
              " A" +
              cap +
              "," +
              hy +
              " 0 0 1 " +
              (x + w - cap) +
              "," +
              (y + h) +
              " L" +
              (x + cap) +
              "," +
              (y + h) +
              " A" +
              cap +
              "," +
              hy +
              " 0 0 1 " +
              (x + cap) +
              "," +
              y +
              '" fill="#fff" stroke="#000" stroke-width="1.5"/>';
            S +=
              '<ellipse cx="' +
              (x + cap) +
              '" cy="' +
              (y + hy) +
              '" rx="' +
              cap +
              '" ry="' +
              hy +
              '" fill="#fff" stroke="#000" stroke-width="1.5"/>';
          } else {
            S +=
              '<rect x="' +
              x +
              '" y="' +
              y +
              '" width="' +
              w +
              '" height="' +
              h +
              '" fill="#fff" stroke="#000" stroke-width="1.5"/>';
          }
          const cxx = x + w / 2;
          let ty =
            n.kind === "db" ? y + 2 * ry + (h - 3 * ry - n.inner) / 2 : y + (h - n.inner) / 2;
          n.lines.forEach((l, i) => {
            ty += i === 0 ? C.TLH : C.SLH;
            S +=
              '<text x="' +
              cxx +
              '" y="' +
              (ty - 5) +
              '" font-size="' +
              l.f +
              '"' +
              (i === 0 ? ' font-weight="bold"' : "") +
              ' text-anchor="middle" fill="#000">' +
              esc(l.t) +
              "</text>";
          });
        });

        /* легенда */
        const ly = totalH - C.M + 14;
        S +=
          '<line x1="' +
          C.M +
          '" y1="' +
          ly +
          '" x2="' +
          (C.M + 50) +
          '" y2="' +
          ly +
          '" stroke="#000" stroke-width="1.5"/>';
        S +=
          '<text x="' +
          (C.M + 58) +
          '" y="' +
          (ly + 4) +
          '" font-size="11" fill="#000">sync</text>';
        S +=
          '<line x1="' +
          (C.M + 120) +
          '" y1="' +
          ly +
          '" x2="' +
          (C.M + 170) +
          '" y2="' +
          ly +
          '" stroke="#000" stroke-width="1.5" stroke-dasharray="7 5"/>';
        S +=
          '<text x="' +
          (C.M + 178) +
          '" y="' +
          (ly + 4) +
          '" font-size="11" fill="#000">async</text>';
        S +=
          '<rect x="' +
          (C.M + 248) +
          '" y="' +
          (ly - 8) +
          '" width="34" height="16" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="1.5 3.5"/>';
        S +=
          '<text x="' +
          (C.M + 290) +
          '" y="' +
          (ly + 4) +
          '" font-size="11" fill="#000">group / region</text>';
        S += "</svg>";

        globalThis.__SVG = S;
        globalThis.__LAYOUT = { nodes: NODES, edges: EDGES, W: totalW, H: totalH };

        if (typeof document !== "undefined") {
          document.getElementById("wrap").innerHTML = S;
        }
      })();
    </script>
  </body>
</html>
