<style>
  *,
  *::before,
  *::after {
    cursor: default !important;
  }
  #wrap[data-diagram-viewport] {
    position: fixed;
    inset: 0;
    bottom: 96px;
    width: auto;
    height: auto;
    overflow: hidden;
    padding: 0;
    background-color: #f7f8fa;
    background-image: radial-gradient(#d7dce3 0.8px, transparent 0.8px);
    background-size: 20px 20px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    outline: none;
  }
  #wrap[data-diagram-viewport]:focus-visible {
    box-shadow: inset 0 0 0 2px #64748b;
  }
  #wrap[data-diagram-viewport] > svg {
    position: absolute;
    left: 0;
    top: 0;
    max-width: none;
    overflow: visible;
    transform-origin: 0 0;
  }
  #diagram-toolbar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px;
    border: 1px solid #dce1e7;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 4px 20px #18223014;
    color: #334155;
    font:
      13px/1.3 system-ui,
      sans-serif;
  }
  #diagram-toolbar[hidden],
  #diagram-hint[hidden] {
    display: none;
  }
  #diagram-toolbar button {
    border: 0;
    border-radius: 7px;
    min-width: 32px;
    height: 32px;
    padding: 0 9px;
    color: inherit;
    background: transparent;
    font: inherit;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #diagram-toolbar button:hover {
    background: #f1f4f8;
  }
  #diagram-toolbar button:focus-visible {
    outline: 2px solid #64748b;
  }
  #diagram-toolbar button:disabled {
    opacity: 0.35;
  }
  #diagram-scale {
    min-width: 56px !important;
  }
  #diagram-fit {
    border-left: 1px solid #e2e8f0 !important;
    border-radius: 0 7px 7px 0 !important;
  }
  #diagram-hint {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 72px;
    text-align: center;
    color: #64748b;
    font:
      11px/1.5 system-ui,
      sans-serif;
    pointer-events: none;
  }
</style>
<div id="diagram-hint" hidden></div>
<div id="diagram-toolbar" role="group" hidden>
  <button id="diagram-out" type="button">−</button>
  <button id="diagram-scale" type="button"></button>
  <button id="diagram-in" type="button">+</button>
  <button id="diagram-fit" type="button"></button>
</div>
<script id="harpyhare-diagram-viewport">
  (() => {
    if (typeof document === "undefined") return;
    const wrap = document.getElementById("wrap");
    const svg = wrap?.querySelector("svg");
    const layout = globalThis.__LAYOUT;
    if (
      !svg ||
      !layout ||
      !Number.isFinite(layout.W) ||
      !Number.isFinite(layout.H) ||
      layout.W <= 0 ||
      layout.H <= 0
    )
      return;
    const labels = __DIAGRAM_LABELS__;
    const toolbar = document.getElementById("diagram-toolbar");
    const hint = document.getElementById("diagram-hint");
    const zoomIn = document.getElementById("diagram-in");
    const zoomOut = document.getElementById("diagram-out");
    const scale = document.getElementById("diagram-scale");
    const fit = document.getElementById("diagram-fit");
    toolbar.setAttribute("aria-label", labels.controls);
    hint.textContent = labels.hint;
    fit.textContent = labels.fit;
    for (const [button, label] of [
      [zoomIn, labels.zoomIn],
      [zoomOut, labels.zoomOut],
      [scale, labels.actualSize],
    ]) {
      button.title = label;
      button.setAttribute("aria-label", label);
    }
    toolbar.hidden = hint.hidden = false;
    document.documentElement.style.overflow = "hidden";
    document.body.style.background = "#f7f8fa";
    document.querySelector(".hint")?.remove();
    wrap.setAttribute("data-diagram-viewport", "");
    wrap.setAttribute("tabindex", "0");
    wrap.setAttribute("aria-label", labels.hint);
    svg.setAttribute("width", layout.W);
    svg.setAttribute("height", layout.H);
    const background = svg.querySelector(":scope > rect");
    if (
      background?.getAttribute("x") === "0" &&
      background.getAttribute("y") === "0" &&
      Number(background.getAttribute("width")) >= layout.W
    )
      background.remove();

    const PAD = 24,
      MAX_ZOOM = 4;
    let z = 1,
      x = PAD,
      y = PAD,
      mode = "readable",
      drag = null;
    let previousWidth = 0,
      previousHeight = 0;
    const area = () => ({ w: wrap.clientWidth, h: Math.max(1, wrap.clientHeight) });
    const fitZoom = () => {
      const { w, h } = area();
      return Math.max(
        0.001,
        Math.min((w - PAD * 2) / layout.W, (h - PAD * 2) / layout.H, MAX_ZOOM),
      );
    };
    const minZoom = () => Math.min(0.1, fitZoom());
    const paint = () => {
      svg.style.transform = `translate(${x}px, ${y}px) scale(${z})`;
      scale.textContent = Math.round(z * 100) + "%";
      zoomIn.disabled = z >= MAX_ZOOM;
      zoomOut.disabled = z <= minZoom();
    };
    const center = () => {
      const { w, h } = area();
      x = Math.max(PAD, (w - layout.W * z) / 2);
      y = Math.max(PAD, (h - layout.H * z) / 2);
      paint();
    };
    const resize = () => {
      const { w, h } = area();
      if (w <= 0 || wrap.clientHeight <= 0) return;
      if (mode !== "manual") {
        z = mode === "fit" ? fitZoom() : Math.min(1, Math.max(0.8, fitZoom()));
        center();
      } else {
        x += (w - previousWidth) / 2;
        y += (h - previousHeight) / 2;
        paint();
      }
      previousWidth = w;
      previousHeight = h;
    };
    const zoom = (next, px, py) => {
      mode = "manual";
      next = Math.min(MAX_ZOOM, Math.max(minZoom(), next));
      const ratio = next / z;
      x = px - (px - x) * ratio;
      y = py - (py - y) * ratio;
      z = next;
      paint();
    };
    const zoomCenter = (factor) => {
      const { w, h } = area();
      zoom(z * factor, w / 2, h / 2);
    };
    fit.addEventListener("click", () => {
      mode = "fit";
      resize();
    });
    scale.addEventListener("click", () => {
      mode = "manual";
      z = 1;
      center();
    });
    zoomIn.addEventListener("click", () => zoomCenter(1.25));
    zoomOut.addEventListener("click", () => zoomCenter(0.8));

    // Capture before legacy renderers' window-level wheel handlers.
    window.addEventListener(
      "wheel",
      (event) => {
        if (!wrap.contains(event.target)) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const delta = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? wrap.clientHeight : 1;
        if (event.ctrlKey || event.metaKey) {
          const rect = wrap.getBoundingClientRect();
          zoom(
            z * Math.exp(-event.deltaY * delta * 0.002),
            event.clientX - rect.left,
            event.clientY - rect.top,
          );
        } else {
          mode = "manual";
          x -= (event.shiftKey ? event.deltaY : event.deltaX) * delta;
          y -= (event.shiftKey ? 0 : event.deltaY) * delta;
          paint();
        }
      },
      { capture: true, passive: false },
    );

    const endDrag = () => {
      if (!drag) return;
      const pointer = drag.id;
      drag = null;
      wrap.removeAttribute("data-dragging");
      if (wrap.hasPointerCapture?.(pointer)) wrap.releasePointerCapture(pointer);
    };
    wrap.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || event.isPrimary === false || drag) return;
      event.preventDefault();
      wrap.focus({ preventScroll: true });
      mode = "manual";
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
      wrap.setPointerCapture(event.pointerId);
      wrap.setAttribute("data-dragging", "");
    });
    wrap.addEventListener("pointermove", (event) => {
      if (!drag || drag.id !== event.pointerId) return;
      x += event.clientX - drag.x;
      y += event.clientY - drag.y;
      drag.x = event.clientX;
      drag.y = event.clientY;
      paint();
    });
    for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) {
      wrap.addEventListener(name, (event) => {
        if (event.pointerId === drag?.id) endDrag();
      });
    }
    window.addEventListener("blur", endDrag);
    wrap.addEventListener("keydown", (event) => {
      const directions = {
        ArrowLeft: [48, 0],
        ArrowRight: [-48, 0],
        ArrowUp: [0, 48],
        ArrowDown: [0, -48],
      };
      const direction = directions[event.key];
      if (direction) {
        event.preventDefault();
        mode = "manual";
        x += direction[0];
        y += direction[1];
        paint();
      } else if (event.key === "+" || event.key === "=") {
        event.preventDefault();
        zoomCenter(1.25);
      } else if (event.key === "-") {
        event.preventDefault();
        zoomCenter(0.8);
      } else if (event.key === "0") {
        event.preventDefault();
        mode = "fit";
        resize();
      }
    });
    resize();
    new ResizeObserver(resize).observe(wrap);
  })();
</script>
